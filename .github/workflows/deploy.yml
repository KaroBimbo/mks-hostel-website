name: Деплой сайта на Timeweb

# Запускается при каждом пуше в main и вручную кнопкой в GitHub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Залить по FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          protocol: ftp
          # Не трогаем то, что уже лежит на сервере и чего нет в репозитории
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            .github/**
            docs/**
            .superpowers/**
            *.md
            .vercelignore
            preview-site-v23.html
            варианты-детализации.html
            для загрузки на сайт/**
            логотип/**
